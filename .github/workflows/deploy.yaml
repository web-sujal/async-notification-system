name: Deploy

on:
  push:
    branches:
      - "master"

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup AWS ECR Details
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: SSH into EC2 instance
        uses: appleboy/ssh-action@v1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG,AWS_REGION,SSH_USERNAME
          script: |
            set -e

            echo "🚀 [Deploy] Initiating deployment sequence on EC2..."

            echo "📂 [Directory] Navigating to target user home directory: /home/$SSH_USERNAME"
            cd /home/$SSH_USERNAME

            echo "🔑 [ECR Login] Fetching authentication token for region: $AWS_REGION, registry: $ECR_REGISTRY..."
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "📝 [Env Update] Injection sequence: updating .env.docker with IMAGE_TAG=$IMAGE_TAG"
            sed -i '/IMAGE_TAG/d' .env.docker
            echo "IMAGE_TAG=$IMAGE_TAG" >> .env.docker

            echo "📥 [Pull] Fetching the latest container versions from ECR registry..."
            docker compose -f docker-compose.prod.yaml pull

            echo "🔄 [Restart] Spinning up new containers and removing obsolete instances..."
            docker compose -f docker-compose.prod.yaml up -d

            echo "✨ [Success] Pipeline completed successfully! Service is now live."

