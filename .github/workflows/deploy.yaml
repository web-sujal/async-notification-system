name: Deploy

on:
  push:
    branches:
      - "master"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/async-notification-system" .

      - name: Push Image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/async-notification-system"
